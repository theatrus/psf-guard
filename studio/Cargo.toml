# PSF-Studio: the native editor that starts from PSF Guard's channel stacks.
# Its binary is `psf-studio`. See docs/design/psf-studio.md.
#
# This workspace stands apart from the PSF Guard workspace on purpose. GPUI
# is a git dependency on Zed and needs a newer toolchain, and neither belongs
# in PSF Guard's lock file. The document model and the tile store are
# compiled from PSF Guard's source, under `src/studio` and `src/image_steps`,
# so the two programs read and write the same documents.
#
# `experiments/` holds the measurements the design record cites: the crop
# preview, the browser canvas, and their results.
[workspace]
members = ["render", "app", "color", "experiments/crop"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
# The compositor the canvas and an export draw with: Seiza's, on the CPU and
# on the GPU. Pinned to the Seiza pull request that adds it until a release
# has it.
seiza-compose = { git = "https://github.com/theatrus/seiza", rev = "476a65b28a31d8669a75fe399ecf7ccaca43699f" }

# The Seiza crates PSF Guard's source and the app use from crates.io, taken
# from the same commit as seiza-compose so the two agree on their types.
[patch.crates-io]
seiza-core = { git = "https://github.com/theatrus/seiza", rev = "476a65b28a31d8669a75fe399ecf7ccaca43699f" }
seiza-fits = { git = "https://github.com/theatrus/seiza", rev = "476a65b28a31d8669a75fe399ecf7ccaca43699f" }
seiza-image-io = { git = "https://github.com/theatrus/seiza", rev = "476a65b28a31d8669a75fe399ecf7ccaca43699f" }
seiza-imgproc = { git = "https://github.com/theatrus/seiza", rev = "476a65b28a31d8669a75fe399ecf7ccaca43699f" }
seiza-stats = { git = "https://github.com/theatrus/seiza", rev = "476a65b28a31d8669a75fe399ecf7ccaca43699f" }
seiza-stretch = { git = "https://github.com/theatrus/seiza", rev = "476a65b28a31d8669a75fe399ecf7ccaca43699f" }
seiza-xisf = { git = "https://github.com/theatrus/seiza", rev = "476a65b28a31d8669a75fe399ecf7ccaca43699f" }

[profile.release]
debug = 1
