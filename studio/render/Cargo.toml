[package]
name = "psf-studio-render"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "The tiled wgpu canvas of PSF-Studio. No dependency on a UI toolkit."

[dependencies]
wgpu.workspace = true
bytemuck.workspace = true
half = "2"
# What a canvas draws, shared with PSF Guard, and its CPU render.
psf-studio-canvas = { path = "../../crates/studio-canvas" }

[dev-dependencies]
# Checks the shaders in tests, as wgpu does when the canvas starts.
naga = { version = "30.0.2", features = ["wgsl-in"] }
