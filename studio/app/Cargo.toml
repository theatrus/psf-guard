[package]
name = "psf-studio"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
psf-studio-render = { path = "../render" }
psf-studio-color = { path = "../color" }
wgpu.workspace = true
gpui = { git = "https://github.com/zed-industries/zed", rev = "f98c2c100d217ace3ca99564cfc4573612d43d47" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f98c2c100d217ace3ca99564cfc4573612d43d47", features = ["runtime_shaders", "font-kit"] }
pollster = "0.4"
# The stretch the canvas shows is resolved and evaluated by Seiza.
seiza-stretch = "0.4.0"
raw-window-handle = "0.6"
serde_json = "1"
png = "0.17"
# For the document model compiled from PSF Guard's source.
serde = { version = "1", features = ["derive"] }
half = "2"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
tempfile = "3"
