[package]
name = "psf-studio"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
dirs = "6"
psf-studio-render = { path = "../render" }
# Seiza's compositor: the picture the canvas draws, and its CPU render for
# an export.
seiza-compose.workspace = true
# An export is written by Seiza.
seiza-fits = "0.9.0"
seiza-image-io = { version = "0.14.0", features = ["avif"] }
psf-studio-color = { path = "../color" }
wgpu.workspace = true
gpui = { git = "https://github.com/zed-industries/zed", rev = "f98c2c100d217ace3ca99564cfc4573612d43d47" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "f98c2c100d217ace3ca99564cfc4573612d43d47", features = ["runtime_shaders", "font-kit"] }
pollster = "0.4"
# The stretch the canvas shows is resolved and evaluated by Seiza.
seiza-stretch = "0.4.0"
serde_json = "1"
png = "0.17"
# The document model, image steps and frame reading, shared with PSF Guard.
psf-studio-core = { path = "../../crates/psf-studio-core" }
serde = { version = "1", features = ["derive"] }
half = "2"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1.0"
# Talking to PSF Guard servers: connecting, browsing their projects.
ureq = { version = "3", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
objc2 = "0.6"
# Server tokens are kept in the macOS Keychain.
security-framework = "3"

[target.'cfg(windows)'.dependencies]
async-channel = "2"
image = { version = "0.25", default-features = false }
smallvec = "1"
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
