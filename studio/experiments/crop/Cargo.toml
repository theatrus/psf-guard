[package]
name = "studio-crop-preview-spike"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true
description = "Investigation 3: a heavy step previewed on a full-resolution crop."

[dependencies]
psf-studio-render = { path = "../../render" }
seiza-deconvolution = "0.2.0"
rayon = "1"
half = "2"
tiny_http = "0.12"
serde_json = "1"
# For the tile store compiled from PSF Guard's source.
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
