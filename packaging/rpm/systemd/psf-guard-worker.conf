# Settings for the psf-guard-worker.service systemd unit, which runs
# `psf-guard worker`. The token makes this file a secret: keep it readable
# by root only.
#
# 1. On the server, open Settings › Workers, click + Add a worker and create
#    a token.
# 2. Enter the server's address and the token below.
# 3. Start the worker, and start it at boot:
#      sudo systemctl enable --now psf-guard-worker

# The server's address, as other computers reach it.
PSF_GUARD_WORKER_SERVER=http://192.168.1.10:3000

# The worker token from the server's Settings › Workers.
PSF_GUARD_WORKER_TOKEN=

# Other options for `psf-guard worker`, split on spaces. Examples:
#   --name observatory-gpu        the name Settings › Workers shows
#   --work stack                  accept stack builds only
#   --slots 2                     run two tasks at once
#   --files shared --map /srv/astro=/mnt/astro
#                                 read task files on shared storage
#   --rc-astro /opt/rc-astro/rc-astro
#                                 the rc-astro executable
PSF_GUARD_WORKER_EXTRA_ARGS=
