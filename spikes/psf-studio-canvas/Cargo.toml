# Investigation 1 of docs/design/psf-studio.md: can a GPUI window host a
# tiled wgpu canvas that meets the responsiveness targets?
#
# This workspace stands apart from the PSF Guard workspace on purpose. GPUI
# is a git dependency on Zed and needs a newer toolchain, and neither belongs
# in PSF Guard's lock file until the investigation says go.
[workspace]
members = ["render", "app", "crop", "color"]
resolver = "3"

[workspace.package]
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
debug = 1
