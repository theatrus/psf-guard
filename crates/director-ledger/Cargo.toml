[package]
name = "psf-guard-director-ledger"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
description = "Durable local attempt accounting for PSF Guard Director"

[dependencies]
psf-guard-director-core = { path = "../director-core" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
