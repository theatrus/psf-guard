[package]
name = "psf-guard-director-meta"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
description = "Opt-in coordination identity storage for PSF Guard Director"

[dependencies]
psf-guard-director-core = { path = "../director-core" }
psf-guard-director-ledger = { path = "../director-ledger" }
psf-guard-director-interop = { path = "../director-interop" }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3.27"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
