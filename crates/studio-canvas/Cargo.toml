[package]
name = "psf-studio-canvas"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
description = "What a PSF Studio canvas draws, and the same picture rendered on the CPU"

[dependencies]
# A stroke segment is uploaded to the GPU as it is.
bytemuck = { version = "1", features = ["derive"] }
# The CPU render works on its tiles in parallel.
rayon = "1"
# A step's settings are the JSON a document stores.
serde_json = "1"
# Output stretches are Seiza's stretches.
seiza-stretch = "0.4.0"
