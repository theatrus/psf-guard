name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # artifact_name is the dedicated console CLI binary (psf-guard-cli),
          # NOT the main `psf-guard` — `cargo tauri build` overwrites
          # target/release/psf-guard with the GUI-subsystem app, so the
          # standalone CLI asset must come from the separate psf-guard-cli target.
          - os: ubuntu-22.04
            artifact_name: psf-guard-cli
            asset_name: psf-guard-linux-x64
          - os: windows-latest
            artifact_name: psf-guard-cli.exe
            asset_name: psf-guard-windows-x64.exe
          - os: macos-latest
            artifact_name: psf-guard-cli
            asset_name: psf-guard-macos-arm64

    steps:
    - uses: actions/checkout@v7

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          libpng-dev \
          patchelf


    - name: Import Apple Developer Certificate (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_CERTIFICATE: ${{ secrets.APPLE_BUILD_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_BUILD_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_PRIVATE: ${{ secrets.APPLE_API_KEY_PRIVATE }}
      run: |
        echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        security find-identity -v -p codesigning build.keychain

        echo $APPLE_API_KEY_PRIVATE | base64 --decode > AuthKey_$APPLE_API_KEY.p8
    - name: Verify Certificate (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID")
        CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
        echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
        echo "Certificate imported."

    - name: Read Rust toolchain
      id: rust-toolchain
      run: echo "channel=$(grep 'channel' rust-toolchain.toml | sed 's/.*= *\"\(.*\)\"/\1/')" >> $GITHUB_OUTPUT
      shell: bash

    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.channel }}
        components: rustfmt, clippy

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: static/package-lock.json

    - name: Install npm dependencies and build frontend
      run: |
        cd static
        npm ci
        npm run build

    - name: Install Tauri CLI
      run: cargo install tauri-cli --version "^2.0" --locked
      continue-on-error: true

    - name: Verify updater signing credentials
      shell: bash
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: |
        test -n "$TAURI_SIGNING_PRIVATE_KEY"
        test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
        probe="$RUNNER_TEMP/psf-guard-updater-signing-probe"
        printf 'PSF Guard updater signing probe\n' > "$probe"
        cargo tauri signer sign "$probe"
        test -s "$probe.sig"

    - name: Check release versions and notes
      shell: bash
      run: |
        version=$(node scripts/check-release-version.mjs "$GITHUB_REF_NAME")
        echo "APP_VERSION=$version" >> "$GITHUB_ENV"

    - name: Write signed updater build config
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          node scripts/write-updater-config.mjs \
            "${{ runner.temp }}/psf-guard-updater.json" \
            tauri.bundle-windows.json
        else
          node scripts/write-updater-config.mjs \
            "${{ runner.temp }}/psf-guard-updater.json"
        fi

    - name: Build CLI binary
      # Dedicated console-subsystem CLI (no tauri) — the standalone release
      # asset. The installer's bundled copy comes from Tauri auto-bundling the
      # psf-guard-cli bin target, so no sidecar staging is needed here.
      run: cargo build --release --locked --bin psf-guard-cli

    - name: Build Tauri desktop app (Linux)
      if: matrix.os == 'ubuntu-22.04'
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: cargo tauri build --verbose --config "${{ runner.temp }}/psf-guard-updater.json"

    - name: Build Tauri desktop app (Windows, with bundled CLI)
      # externalBin (the CLI sidecar staged above) + the NSIS PATH hook live in
      # tauri.bundle-windows.json, applied only here via --config so other
      # tauri-feature compiles don't require the sidecar.
      if: matrix.os == 'windows-latest'
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: cargo tauri build --verbose --config "${{ runner.temp }}/psf-guard-updater.json"

    - name: Build Tauri desktop app (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_PATH: AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: |
        bash scripts/package-macos.sh --config "${{ runner.temp }}/psf-guard-updater.json"

    - name: Prepare release assets
      shell: bash
      run: |
        mkdir -p release-assets

        # Copy CLI binary
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cp target/release/${{ matrix.artifact_name }} release-assets/${{ matrix.asset_name }}
        else
          cp target/release/${{ matrix.artifact_name }} release-assets/${{ matrix.asset_name }}
        fi

        # Copy Tauri bundles based on platform
        case "${{ matrix.os }}" in
          ubuntu-22.04)
            # Copy .deb packages
            find target/release/bundle/deb -name "*.deb" -exec cp {} release-assets/ \; 2>/dev/null || echo "No .deb files found"
            # Copy AppImages
            find target/release/bundle/appimage -name "*.AppImage" -exec cp {} release-assets/ \; 2>/dev/null || echo "No .AppImage files found"
            updater=$(find target/release/bundle/appimage -name "*.AppImage" -print -quit)
            test -n "$updater" && test -s "$updater.sig"
            cp "$updater" "release-assets/PSF-Guard-${APP_VERSION}-linux-x86_64.AppImage"
            cp "$updater.sig" "release-assets/PSF-Guard-${APP_VERSION}-linux-x86_64.AppImage.sig"
            ;;
          windows-latest)
            # Copy .msi installers
            find target/release/bundle/msi -name "*.msi" -exec cp {} release-assets/ \; 2>/dev/null || echo "No .msi files found"
            # Copy NSIS installers. -exec is space-safe: the old
            # `cp "$file" release-assets/$(basename ...)-installer.exe` pipeline
            # word-split on the space in "PSF Guard_..." and silently copied
            # nothing (why v0.3.0/v0.4.0 releases initially lacked the NSIS
            # asset). Keep the original "-setup.exe" name — it's what the docs
            # reference.
            find target/release/bundle/nsis -name "*.exe" -exec cp {} release-assets/ \; 2>/dev/null || echo "No NSIS .exe files found"
            updater=$(find target/release/bundle/nsis -name "*.exe" -print -quit)
            test -n "$updater" && test -s "$updater.sig"
            cp "$updater" "release-assets/PSF-Guard-${APP_VERSION}-windows-x64-setup.exe"
            cp "$updater.sig" "release-assets/PSF-Guard-${APP_VERSION}-windows-x64-setup.exe.sig"
            ;;
          macos-latest)
            # Copy .dmg installers
            find target/release/bundle/dmg -name "*.dmg" -exec cp {} release-assets/ \; 2>/dev/null || echo "No .dmg files found"
            # Create zip of .app bundles
            if [ -d "target/release/bundle/macos" ]; then
              cd target/release/bundle/macos
              for app in *.app; do
                if [ -d "$app" ]; then
                  zip -r "../../../../release-assets/${app%.app}-macos.zip" "$app" 2>/dev/null || echo "Failed to zip $app"
                fi
              done
              cd ../../../../
            fi
            updater=$(find target/release/bundle/macos -name "*.app.tar.gz" -print -quit)
            test -n "$updater" && test -s "$updater.sig"
            cp "$updater" "release-assets/PSF-Guard-${APP_VERSION}-macos-aarch64.app.tar.gz"
            cp "$updater.sig" "release-assets/PSF-Guard-${APP_VERSION}-macos-aarch64.app.tar.gz.sig"
            ;;
        esac

        echo "Release assets prepared:"
        ls -la release-assets/

    - name: Upload release assets
      uses: softprops/action-gh-release@v3
      with:
        files: release-assets/*
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        generate_release_notes: true
        name: PSF Guard ${{ github.ref_name }}
        body_path: docs/releases/${{ github.ref_name }}.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-update-feeds:
    name: Publish updater and server notice feeds
    runs-on: ubuntu-22.04
    needs: build
    steps:
    - uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Test release metadata and feed generation
      run: node --test scripts/check-release-version.test.mjs scripts/release-feeds.test.mjs

    - name: Download signed updater assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version=$(node -p 'require("./tauri.conf.json").version')
        test "$GITHUB_REF_NAME" = "v$version"
        echo "APP_VERSION=$version" >> "$GITHUB_ENV"
        mkdir update-feeds
        gh release download "$GITHUB_REF_NAME" --dir update-feeds \
          --pattern "PSF-Guard-${version}-windows-x64-setup.exe" \
          --pattern "PSF-Guard-${version}-windows-x64-setup.exe.sig" \
          --pattern "PSF-Guard-${version}-linux-x86_64.AppImage" \
          --pattern "PSF-Guard-${version}-linux-x86_64.AppImage.sig" \
          --pattern "PSF-Guard-${version}-macos-aarch64.app.tar.gz" \
          --pattern "PSF-Guard-${version}-macos-aarch64.app.tar.gz.sig"

    - name: Build update feeds
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        published_at=$(gh api \
          "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
          --jq .published_at)
        node scripts/release-feeds.mjs \
          update-feeds \
          "$APP_VERSION" \
          "$GITHUB_REF_NAME" \
          "$published_at"

    - name: Attach update feeds to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "$GITHUB_REF_NAME" \
          update-feeds/updater.json \
          update-feeds/notice.json \
          --clobber
