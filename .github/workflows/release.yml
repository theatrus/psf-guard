name: Release

on:
  push:
    tags:
      - 'v*'
  # Dry run: exercise the full build + signing path on demand without
  # publishing anything. The Windows signing chain (two-phase build, signature
  # survival through bundling, updater .sig regeneration) is otherwise only
  # exercised by a real release, which is a poor place to discover a mistake.
  workflow_dispatch:

permissions:
  contents: write
  # Required for the OIDC exchange with Entra that authenticates Windows
  # Authenticode signing. No Azure secret is stored in this repo.
  id-token: write

jobs:
  build:
    name: Build release on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The Entra federated credential is bound to the subject
    # `repo:theatrus/psf-guard:environment:release`, so this job must run in the
    # `release` environment or the OIDC token will not match and azure/login
    # fails. Classic federated credentials require an exact subject match --
    # `refs/tags/v*` cannot be expressed as a wildcard without the preview
    # flexible-federation feature, hence binding to the environment instead.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # artifact_name is the dedicated console CLI binary (psf-guard-cli),
          # NOT the main `psf-guard` — `cargo tauri build` overwrites
          # target/release/psf-guard with the GUI-subsystem app, so the
          # standalone CLI asset must come from the separate psf-guard-cli target.
          - os: ubuntu-22.04
            artifact_name: psf-guard-cli
            asset_name: psf-guard-linux-x64
          - os: windows-latest
            artifact_name: psf-guard-cli.exe
            asset_name: psf-guard-windows-x64.exe
          - os: macos-latest
            artifact_name: psf-guard-cli
            asset_name: psf-guard-macos-arm64

    steps:
    - uses: actions/checkout@v7

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          libpng-dev \
          patchelf


    - name: Import Apple Developer Certificate (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_CERTIFICATE: ${{ secrets.APPLE_BUILD_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_BUILD_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_PRIVATE: ${{ secrets.APPLE_API_KEY_PRIVATE }}
      run: |
        echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        security find-identity -v -p codesigning build.keychain

        echo $APPLE_API_KEY_PRIVATE | base64 --decode > AuthKey_$APPLE_API_KEY.p8
    - name: Verify Certificate (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID")
        CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
        echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
        echo "Certificate imported."

    - name: Read Rust toolchain
      id: rust-toolchain
      run: echo "channel=$(grep 'channel' rust-toolchain.toml | sed 's/.*= *\"\(.*\)\"/\1/')" >> $GITHUB_OUTPUT
      shell: bash

    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.channel }}
        components: rustfmt, clippy

    # This workflow had no cargo cache at all, so every release compiled the
    # whole dependency tree from cold on three platforms. Read main's cache
    # and never write: a cache saved under a tag ref is scoped to that tag and
    # could never be read again, so saving here would only consume the repo's
    # 10 GB budget. Worst case this restores nothing and we are no slower than
    # before.
    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2
      with:
        key: tauri
        save-if: false

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: static/package-lock.json

    - name: Install npm dependencies and build frontend
      run: |
        cd static
        npm ci
        npm run build

    # Prebuilt binary rather than a from-source build; this step alone was
    # 594s of the 36-minute Windows release job.
    - name: Install Tauri CLI
      uses: taiki-e/install-action@v2
      with:
        tool: tauri-cli@2

    - name: Verify updater signing credentials
      shell: bash
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: |
        test -n "$TAURI_SIGNING_PRIVATE_KEY"
        test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
        probe="$RUNNER_TEMP/psf-guard-updater-signing-probe"
        printf 'PSF Guard updater signing probe\n' > "$probe"
        cargo tauri signer sign "$probe"
        test -s "$probe.sig"

    - name: Check release versions and notes
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          # No tag to check against on a dry run, so derive the expected tag
          # from Cargo.toml. The script still enforces that Cargo.toml,
          # Cargo.lock, tauri.conf.json and the RPM spec agree.
          ref="v$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')"
          echo "dry run: checking against derived tag $ref"
        else
          ref="$GITHUB_REF_NAME"
        fi
        version=$(node scripts/check-release-version.mjs "$ref")
        echo "APP_VERSION=$version" >> "$GITHUB_ENV"

    - name: Write signed updater build config
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          node scripts/write-updater-config.mjs \
            "${{ runner.temp }}/psf-guard-updater.json" \
            tauri.bundle-windows.json
        else
          node scripts/write-updater-config.mjs \
            "${{ runner.temp }}/psf-guard-updater.json"
        fi

    - name: Build CLI binary
      # Dedicated console-subsystem CLI (no tauri) — the standalone release
      # asset. The installer's bundled copy comes from Tauri auto-bundling the
      # psf-guard-cli bin target, so no sidecar staging is needed here.
      run: cargo build --release --locked --bin psf-guard-cli

    - name: Build Tauri desktop app (Linux)
      if: matrix.os == 'ubuntu-22.04'
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: cargo tauri build --verbose --config "${{ runner.temp }}/psf-guard-updater.json"

    # Windows builds in two phases so the app binaries can be signed *before*
    # they are packaged. Bundling in one pass would seal unsigned executables
    # inside a signed installer: the download would look fine, but the program
    # a user actually runs afterwards would carry no publisher identity, and
    # enterprise unsigned-binary scans would flag it post-install.
    #
    # The NSIS PATH hook lives in tauri.bundle-windows.json, applied via
    # --config so other tauri-feature compiles don't require it.
    - name: Compile Tauri desktop app (Windows, no bundle yet)
      if: matrix.os == 'windows-latest'
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: cargo tauri build --verbose --no-bundle --config "${{ runner.temp }}/psf-guard-updater.json"

    # Sign via Tauri's own signCommand, not by signing the binaries ourselves
    # beforehand.
    #
    # The earlier approach -- sign target/release/*.exe, then bundle -- looked
    # right and did not work. `tauri bundle` rewrites the main executable as it
    # packages it, so the copy sealed into the installer carried a signature
    # whose digest no longer matched (0x80096010). Confirmed with signtool on
    # the runner and osslsigncode locally, and isolated by psf-guard-cli.exe
    # from the same installer, unpacked by the same 7z, coming out
    # byte-identical and valid. Only the main binary is touched.
    #
    # signCommand is the correct hook because Tauri invokes it on each artifact
    # at the point it is about to package it -- after whatever rewriting it
    # does, and again for the installers themselves. Microsoft's action cannot
    # serve as one (it is an action, not a command); `dotnet sign` can, and it
    # authenticates through DefaultAzureCredential, so no secret is stored.
    #
    # This is also why the compile is split out above with --no-bundle. The
    # OIDC client assertion azure/login exchanges lives five minutes, and the
    # compile takes twenty-plus; logging in before it would leave a dead
    # assertion by the time signCommand fired mid-bundle. Compiling first means
    # every Azure call happens within a couple of minutes of the login below.
    - name: Authenticate to Azure for code signing
      if: matrix.os == 'windows-latest' && vars.AZURE_CLIENT_ID != ''
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: Install dotnet sign
      if: matrix.os == 'windows-latest' && vars.AZURE_CLIENT_ID != ''
      shell: bash
      run: |
        dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-sign" --prerelease sign
        echo "SIGN_TOOL=$(cygpath -w "$RUNNER_TEMP/dotnet-sign/sign.exe")" >> "$GITHUB_ENV"

    # The standalone CLI ships as its own release asset and is built outside
    # the bundler, so Tauri never sees it and signCommand never covers it.
    - name: Sign the standalone CLI binary
      if: matrix.os == 'windows-latest' && vars.AZURE_CLIENT_ID != ''
      shell: bash
      run: |
        set -euo pipefail
        "$SIGN_TOOL" code artifact-signing \
          --azure-credential-type azure-cli \
          --artifact-signing-endpoint "${{ vars.SIGNING_ENDPOINT }}" \
          --artifact-signing-account "${{ vars.SIGNING_ACCOUNT }}" \
          --artifact-signing-certificate-profile "${{ vars.SIGNING_PROFILE }}" \
          --timestamp-url http://timestamp.acs.microsoft.com \
          "$(cygpath -w "$PWD/target/release/psf-guard-cli.exe")"

    # Injected into the generated config rather than committed to
    # tauri.bundle-windows.json, which local Windows builds also use: baking in
    # a signCommand would break every developer without Azure credentials.
    #
    # azure-cli is named explicitly instead of letting DefaultAzureCredential
    # walk its chain. azure/login has established exactly that session, and
    # naming it turns a failure into one clear message rather than eight
    # stacked ones.
    #
    # The tool path is NOT quoted. Tauri splits signCommand on whitespace and
    # takes the first token as the program name, so quotes end up inside the
    # filename and bundling dies with os error 123, ERROR_INVALID_NAME. The
    # path is installed under RUNNER_TEMP and contains no spaces, so it does
    # not need them.
    - name: Enable Authenticode signing in the build config
      if: matrix.os == 'windows-latest' && vars.AZURE_CLIENT_ID != ''
      shell: bash
      run: |
        node -e '
          const fs = require("fs");
          const p = process.argv[1];
          const cfg = JSON.parse(fs.readFileSync(p, "utf8"));
          cfg.bundle ??= {};
          cfg.bundle.windows ??= {};
          cfg.bundle.windows.signCommand =
            `${process.env.SIGN_TOOL} code artifact-signing`
            + ` --azure-credential-type azure-cli`
            + ` --artifact-signing-endpoint ${process.env.SIGNING_ENDPOINT}`
            + ` --artifact-signing-account ${process.env.SIGNING_ACCOUNT}`
            + ` --artifact-signing-certificate-profile ${process.env.SIGNING_PROFILE}`
            + ` --timestamp-url http://timestamp.acs.microsoft.com`
            + ` %1`;
          fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + "\n");
          console.log(cfg.bundle.windows.signCommand);
        ' "${{ runner.temp }}/psf-guard-updater.json"
      env:
        SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
        SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
        SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}

    - name: Bundle Tauri installers (Windows)
      if: matrix.os == 'windows-latest'
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: cargo tauri bundle --verbose --config "${{ runner.temp }}/psf-guard-updater.json"

    # Sign after bundling, not via Tauri's `signCommand`.
    #
    # The obvious route -- bundle.windows.signCommand -- needs a signing tool
    # that can run as a plain shell command. The community trusted-signing-cli
    # can, but it hard-requires AZURE_CLIENT_SECRET and has no OIDC path, which
    # would mean storing a signing secret in this repo. Microsoft's own action
    # authenticates through DefaultAzureCredential (so it rides the azure/login
    # session above and needs no secret) but, being an action, cannot be a
    # signCommand.
    #
    # Signing here instead is not a workaround so much as an improvement: the
    # Authenticode-then-updater-signature ordering becomes explicit and
    # reviewable in this file, rather than an implementation detail of Tauri's
    # bundler that could change under us. It also covers the standalone CLI
    # binary, which Tauri never touches because it is built outside the bundler.
    # No post-bundle signing step: signCommand already signed the installers as
    # Tauri produced them. Signing them again here would spend quota twice and
    # append a second signature to files that already carry a valid one. If
    # Tauri ever stops invoking signCommand for the installers, the verification
    # below fails rather than letting unsigned installers through.

    # The updater signature must cover the *signed* installer. Tauri generated
    # a .sig during bundling, over the pre-Authenticode bytes -- that one is now
    # stale and would make every existing install refuse the update. Regenerate
    # it over the final artifact.
    - name: Re-sign updater artifacts over the signed installer
      if: matrix.os == 'windows-latest' && vars.AZURE_CLIENT_ID != ''
      shell: bash
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: |
        set -euo pipefail
        installer=$(find target/release/bundle/nsis -name "*-setup.exe" -print -quit)
        test -n "$installer" || { echo "no NSIS installer found"; exit 1; }
        rm -f "$installer.sig"
        cargo tauri signer sign "$installer"
        test -s "$installer.sig"
        echo "regenerated: $installer.sig"

    # Asserts the failure mode that is otherwise invisible: if the updater .sig
    # did not cover the Authenticode-signed bytes, CI would stay green and the
    # artifacts would look fine, while every existing install silently failed
    # signature verification and could not auto-update.
    - name: Verify Windows signatures
      if: matrix.os == 'windows-latest' && vars.AZURE_CLIENT_ID != ''
      shell: bash
      run: |
        set -euo pipefail
        signtool=$(find "/c/Program Files (x86)/Windows Kits/10/bin" \
                     -name signtool.exe -path "*x64*" | sort | tail -1)
        echo "using: $signtool"

        installer=$(find target/release/bundle/nsis -name "*-setup.exe" -print -quit)
        msi=$(find target/release/bundle/msi -name "*.msi" -print -quit)

        verify() {
          local f="$1"
          test -n "$f" && test -f "$f" || { echo "missing artifact: $f"; exit 1; }
          echo "--- $f"
          "$signtool" verify //pa //v "$f" | tee "$RUNNER_TEMP/v.txt"
          grep -q "StackFoundry LLC" "$RUNNER_TEMP/v.txt" \
            || { echo "FAIL: unexpected signing identity for $f"; exit 1; }
        }

        # What a user downloads.
        verify "$installer"
        verify "$msi"
        # The loose binaries we signed before bundling.
        verify target/release/psf-guard.exe
        verify target/release/psf-guard-cli.exe

        # And -- the point of the two-phase build -- the copies that are
        # actually sealed inside the installer.
        #
        # Verifying target/release only proves those files were signed at some
        # point. It says nothing about which bytes `tauri bundle` picked up, so
        # it would pass just as happily if bundling had rebuilt or substituted
        # them and shipped unsigned executables inside a signed wrapper. Since
        # the whole two-phase build exists to prevent exactly that, the check
        # has to open the installer and look.
        extract="$RUNNER_TEMP/nsis-contents"
        rm -rf "$extract"
        7z x -o"$extract" "$installer" > /dev/null
        for name in psf-guard.exe psf-guard-cli.exe; do
          inner=$(find "$extract" -name "$name" -print -quit)
          test -n "$inner" || { echo "FAIL: $name not found inside the installer"; exit 1; }

          # Compare against the file we signed before bundling. This
          # distinguishes the two ways the check below can fail, which
          # otherwise look identical:
          #   hashes equal    -> the bundler shipped our signed bytes, and any
          #                      verify failure is an artefact of how 7z
          #                      unpacks NSIS rather than a real problem;
          #   hashes differ   -> the bundler shipped different bytes, so the
          #                      signing happened too early to matter and the
          #                      two-phase build does not do what it claims.
          signed_hash=$(sha256sum "target/release/$name" | cut -d' ' -f1)
          inner_hash=$(sha256sum "$inner" | tr -d '\\' | cut -d' ' -f1)
          signed_size=$(stat -c %s "target/release/$name")
          inner_size=$(stat -c %s "$inner")
          echo "--- (from NSIS) $name"
          echo "    signed : $signed_hash  ($signed_size bytes)"
          echo "    inside : $inner_hash  ($inner_size bytes)"
          if [ "$signed_hash" = "$inner_hash" ]; then
            echo "    -> byte-identical"
          elif [ "$signed_size" != "$inner_size" ]; then
            echo "    -> SIZE DIFFERS by $((inner_size - signed_size)) bytes"
          else
            echo "    -> same size, different content"
          fi
          # Fatal again. This was made non-fatal only while diagnosing whether
          # the mismatch came from the bundler or from 7z; that question is
          # settled (the bundler rewrote the main binary, which signCommand
          # now handles), so a failure here is a real defect once more.
          verify "$inner"
        done

        # Cross-check against the MSI. Both installers are built by the same
        # `tauri bundle` run from the same inputs, so if the MSI's copy of a
        # binary verifies while the NSIS one does not, the signatures did
        # survive bundling and the fault is in how 7z unpacks NSIS -- a
        # limitation of the check, not of the build. If BOTH fail, bundling
        # really is discarding the signed bytes and the two-phase build is
        # pointless. MSI is a documented container that 7z handles reliably,
        # which is what makes it usable as the control here.
        # Cross-check the MSI as well. Both installers come out of the same
        # `tauri bundle` run, so agreement between them is good evidence the
        # signing hook fired everywhere it should.
        msi_extract="$RUNNER_TEMP/msi-contents"
        rm -rf "$msi_extract"
        7z x -o"$msi_extract" "$msi" > /dev/null
        msi_checked=0
        for name in psf-guard.exe psf-guard-cli.exe; do
          inner=$(find "$msi_extract" -iname "$name" -print -quit)
          if [ -z "$inner" ]; then
            echo "--- (from MSI) $name: not found under that name; skipping"
            continue
          fi
          msi_checked=$((msi_checked + 1))
          echo "--- (from MSI) $name"
          verify "$inner"
        done
        # An earlier version printed "the MSI's copies verify" even when every
        # file had been skipped, because nothing had failed. A check that finds
        # nothing proves nothing, and saying otherwise turned a green run into
        # misinformation.
        if [ "$msi_checked" = "0" ]; then
          echo "note: MSI stores files under mangled names; no MSI-side check performed."
          echo "      The NSIS checks above are what this run actually verified."
        else
          echo "OK: $msi_checked binaries from the MSI verify too"
        fi

        # Ordering: the .sig must be at least as new as the signed installer.
        test -f "$installer.sig" || { echo "no updater .sig"; exit 1; }
        if [ "$installer" -nt "$installer.sig" ]; then
          echo "FAIL: installer is newer than its .sig -- the .sig covers"
          echo "      pre-Authenticode bytes and updates would break."
          exit 1
        fi
        echo "OK: installer, msi and CLI signed as StackFoundry LLC; .sig is current"

    - name: Build Tauri desktop app (macOS)
      if: matrix.os == 'macos-latest'
      env:
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_PATH: AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      run: |
        bash scripts/package-macos.sh --config "${{ runner.temp }}/psf-guard-updater.json"

    # Tauri notarizes and staples the app before it creates the DMG. The disk
    # image is signed afterward, so submit and staple that final artifact too.
    # These checks keep an unnotarized installer out of the public release.
    - name: Notarize and verify macOS disk image
      if: matrix.os == 'macos-latest'
      env:
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_PATH: AuthKey_${{ secrets.APPLE_API_KEY }}.p8
      shell: bash
      run: |
        app=$(find target/release/bundle/macos -maxdepth 1 -name "*.app" -print -quit)
        dmg=$(find target/release/bundle/dmg -maxdepth 1 -name "*.dmg" -print -quit)
        test -n "$app" && test -d "$app"
        test -n "$dmg" && test -s "$dmg"

        codesign --verify --deep --strict --verbose=2 "$app"
        xcrun stapler validate "$app"
        xcrun notarytool submit "$dmg" \
          --key "$APPLE_API_KEY_PATH" \
          --key-id "$APPLE_API_KEY" \
          --issuer "$APPLE_API_ISSUER" \
          --wait
        xcrun stapler staple "$dmg"
        hdiutil verify "$dmg"
        xcrun stapler validate "$dmg"
        spctl --assess --type open --context context:primary-signature -v "$dmg"

    - name: Prepare release assets
      # always(): when verification fails these are exactly the files needed
      # for diagnosis, and the upload below has nothing to collect without them.
      if: always()
      shell: bash
      run: |
        mkdir -p release-assets

        # Copy CLI binary
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          cp target/release/${{ matrix.artifact_name }} release-assets/${{ matrix.asset_name }}
        else
          cp target/release/${{ matrix.artifact_name }} release-assets/${{ matrix.asset_name }}
        fi

        # Copy Tauri bundles based on platform
        case "${{ matrix.os }}" in
          ubuntu-22.04)
            # Copy .deb packages
            find target/release/bundle/deb -name "*.deb" -exec cp {} release-assets/ \; 2>/dev/null || echo "No .deb files found"
            # Copy AppImages
            find target/release/bundle/appimage -name "*.AppImage" -exec cp {} release-assets/ \; 2>/dev/null || echo "No .AppImage files found"
            updater=$(find target/release/bundle/appimage -name "*.AppImage" -print -quit)
            test -n "$updater" && test -s "$updater.sig"
            cp "$updater" "release-assets/PSF-Guard-${APP_VERSION}-linux-x86_64.AppImage"
            cp "$updater.sig" "release-assets/PSF-Guard-${APP_VERSION}-linux-x86_64.AppImage.sig"
            ;;
          windows-latest)
            # Copy .msi installers
            find target/release/bundle/msi -name "*.msi" -exec cp {} release-assets/ \; 2>/dev/null || echo "No .msi files found"
            # Copy NSIS installers. -exec is space-safe: the old
            # `cp "$file" release-assets/$(basename ...)-installer.exe` pipeline
            # word-split on the space in "PSF Guard_..." and silently copied
            # nothing (why v0.3.0/v0.4.0 releases initially lacked the NSIS
            # asset). Keep the original "-setup.exe" name — it's what the docs
            # reference.
            find target/release/bundle/nsis -name "*.exe" -exec cp {} release-assets/ \; 2>/dev/null || echo "No NSIS .exe files found"
            updater=$(find target/release/bundle/nsis -name "*.exe" -print -quit)
            test -n "$updater" && test -s "$updater.sig"
            cp "$updater" "release-assets/PSF-Guard-${APP_VERSION}-windows-x64-setup.exe"
            cp "$updater.sig" "release-assets/PSF-Guard-${APP_VERSION}-windows-x64-setup.exe.sig"
            ;;
          macos-latest)
            # Tauri's generated name has varied between x64 and aarch64 on
            # Apple's arm64 runners. Publish one stable, accurate name.
            dmg=$(find target/release/bundle/dmg -name "*.dmg" -print -quit)
            test -n "$dmg" && test -s "$dmg"
            cp "$dmg" "release-assets/PSF.Guard_${APP_VERSION}_aarch64.dmg"
            # Create zip of .app bundles
            if [ -d "target/release/bundle/macos" ]; then
              cd target/release/bundle/macos
              for app in *.app; do
                if [ -d "$app" ]; then
                  zip -r "../../../../release-assets/${app%.app}-macos.zip" "$app" 2>/dev/null || echo "Failed to zip $app"
                fi
              done
              cd ../../../../
            fi
            updater=$(find target/release/bundle/macos -name "*.app.tar.gz" -print -quit)
            test -n "$updater" && test -s "$updater.sig"
            cp "$updater" "release-assets/PSF-Guard-${APP_VERSION}-macos-aarch64.app.tar.gz"
            cp "$updater.sig" "release-assets/PSF-Guard-${APP_VERSION}-macos-aarch64.app.tar.gz.sig"
            ;;
        esac

        echo "Release assets prepared:"
        ls -la release-assets/

    # A dry run publishes nothing, so without this there would be no way to
    # actually inspect what it produced -- and "CI said the verify step passed"
    # is weaker evidence than holding the signed installer and checking it
    # yourself. Retained briefly; these are throwaway build outputs.
    - name: Upload dry-run artifacts for inspection
      # always(), not success(): a failed verification is precisely when the
      # artifacts need inspecting by hand, and skipping the upload then leaves
      # nothing to look at.
      if: always() && github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: dry-run-${{ matrix.os }}
        path: release-assets/*
        retention-days: 5
        if-no-files-found: error

    - name: Upload release assets
      # Never publish from a dry run -- it would create a GitHub release for
      # whatever version happens to be in Cargo.toml.
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v3
      with:
        files: release-assets/*
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        generate_release_notes: true
        name: PSF Guard ${{ github.ref_name }}
        body_path: docs/releases/${{ github.ref_name }}.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-update-feeds:
    name: Publish updater and server notice feeds
    runs-on: ubuntu-22.04
    needs: build
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Test release metadata and feed generation
      run: node --test scripts/check-release-version.test.mjs scripts/release-feeds.test.mjs

    - name: Download signed updater assets
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        version=$(node -p 'require("./tauri.conf.json").version')
        test "$GITHUB_REF_NAME" = "v$version"
        echo "APP_VERSION=$version" >> "$GITHUB_ENV"
        mkdir update-feeds
        gh release download "$GITHUB_REF_NAME" --dir update-feeds \
          --pattern "PSF-Guard-${version}-windows-x64-setup.exe" \
          --pattern "PSF-Guard-${version}-windows-x64-setup.exe.sig" \
          --pattern "PSF-Guard-${version}-linux-x86_64.AppImage" \
          --pattern "PSF-Guard-${version}-linux-x86_64.AppImage.sig" \
          --pattern "PSF-Guard-${version}-macos-aarch64.app.tar.gz" \
          --pattern "PSF-Guard-${version}-macos-aarch64.app.tar.gz.sig"

    - name: Build update feeds
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        published_at=$(gh api \
          "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
          --jq .published_at)
        # No summary argument: release-feeds.mjs takes the first sentence of
        # docs/releases/<tag>.md, which the checkout above provides. Passing
        # one here would override it.
        node scripts/release-feeds.mjs \
          update-feeds \
          "$APP_VERSION" \
          "$GITHUB_REF_NAME" \
          "$published_at"

    - name: Attach update feeds to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release upload "$GITHUB_REF_NAME" \
          update-feeds/updater.json \
          update-feeds/notice.json \
          --clobber
