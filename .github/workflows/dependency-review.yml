name: 'Dependency Review'

# Linux (x64 and arm64) jobs run on ephemeral 32-core runners (tfinfra
# roots/github-runners, docs/github-runners-plan.md). Windows, macOS and
# every pull request from a fork stay on GitHub's runners: a fork's code
# never runs on ours. (Windows ran on ours for a week; on-demand Windows
# licensing made it cost more than it saved.) Job names are unchanged, so
# the required checks still match.
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ghr-linux-x64"]') }}
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7
        
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5
        with:
          config-file: './.github/dependency-review-config.yml'
          fail-on-severity: critical
