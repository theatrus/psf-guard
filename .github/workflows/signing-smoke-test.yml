# On-demand check that Windows code signing still works end to end.
#
# The real signing path only runs on a `v*` tag, so without this the first live
# exercise of the credential chain would be a real release. This isolates the
# parts most likely to break -- the OIDC subject match, the Certificate Profile
# Signer role, and the endpoint/account/profile values -- and checks them
# against a throwaway binary in a couple of minutes rather than a 36-minute
# Tauri build.
#
# Worth keeping rather than deleting after the first run: re-run it after any
# change to the Entra app, the federated credential, the certificate profile, or
# the signing account, and find out immediately instead of at the next release.
#
# Does NOT cover the Tauri updater `.sig` ordering -- that needs a real bundle,
# and release.yml asserts it inline.
name: Signing smoke test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: Azure Artifact Signing smoke test
    runs-on: windows-latest
    # Must match the Entra federated credential subject
    # `repo:theatrus/psf-guard:environment:release`.
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Show what we are about to use
        shell: bash
        run: |
          echo "client id set : ${{ vars.AZURE_CLIENT_ID != '' }}"
          echo "endpoint      : ${{ vars.SIGNING_ENDPOINT }}"
          echo "account       : ${{ vars.SIGNING_ACCOUNT }}"
          echo "profile       : ${{ vars.SIGNING_PROFILE }}"

      # Failure here means the OIDC subject did not match the federated
      # credential. That is the single most likely thing to be wrong.
      - name: Authenticate to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm the identity we ended up as
        shell: bash
        run: az account show --query "{sub:name,user:user.name,type:user.type}" -o json

      # A throwaway PE to sign. Rust is preinstalled on the runner, so this is
      # far cheaper than building the real app just to test the credential path.
      - name: Build a throwaway binary
        shell: bash
        run: |
          cargo new --bin "$RUNNER_TEMP/sigtest" --vcs none
          cd "$RUNNER_TEMP/sigtest"
          cargo build --release
          cp target/release/sigtest.exe "$GITHUB_WORKSPACE/sigtest.exe"
          ls -l "$GITHUB_WORKSPACE/sigtest.exe"

      # Must use the same signing tool as release.yml, or this stops testing
      # the thing it claims to test. Microsoft's action authenticates through
      # DefaultAzureCredential and so rides the azure/login session above.
      #
      # The community `trusted-signing-cli` was tried first and rejected: it
      # hard-requires AZURE_CLIENT_SECRET with no OIDC path, which would have
      # meant storing a signing secret in the repo.
      - name: Sign it
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\sigtest.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the signature and publisher
        shell: bash
        run: |
          set -euo pipefail
          signtool=$(find "/c/Program Files (x86)/Windows Kits/10/bin" \
                       -name signtool.exe -path "*x64*" | sort | tail -1)
          echo "using: $signtool"
          "$signtool" verify //pa //v  "$GITHUB_WORKSPACE/sigtest.exe" | tee "$RUNNER_TEMP/verify.txt"
          grep -q "StackFoundry LLC" "$RUNNER_TEMP/verify.txt" \
            || { echo "FAIL: expected publisher StackFoundry LLC"; exit 1; }
          echo "OK: signed and chains to a trusted root as StackFoundry LLC"

      # ----------------------------------------------------------------------
      # Second half: establish the `dotnet sign` CLI surface.
      #
      # The action above cannot be used as a Tauri `bundle.windows.signCommand`
      # because it is an action, not a shell command -- and signCommand turns
      # out to be the only correct integration point for a Tauri app. Signing
      # the main binary before `tauri bundle` does not survive: bundling
      # rewrites that executable, leaving a signature whose digest no longer
      # matches (verified with both signtool and osslsigncode, while the
      # auxiliary binary from the same installer stayed byte-identical).
      #
      # `dotnet sign` is a plain shell command AND authenticates through
      # DefaultAzureCredential, so it can be a signCommand without a stored
      # secret. Its exact subcommand name is undocumented in the README and
      # moved with the Trusted Signing -> Artifact Signing rename, so probe it
      # here in a two-minute job rather than discovering it thirty minutes into
      # a release build.
      # ----------------------------------------------------------------------
      - name: Install dotnet sign
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/signtool-dotnet" --prerelease sign
          "$RUNNER_TEMP/signtool-dotnet/sign" --version || true

      - name: Probe the sign CLI surface
        shell: bash
        run: |
          sign="$RUNNER_TEMP/signtool-dotnet/sign"
          echo "=== sign code --help ==="
          "$sign" code --help || true
          for sub in artifact-signing trusted-signing azure-trusted-signing; do
            echo "=== sign code $sub --help ==="
            "$sign" code "$sub" --help 2>&1 | head -40 || true
          done

      - name: Sign a second binary with dotnet sign
        shell: bash
        run: |
          set -euo pipefail
          sign="$RUNNER_TEMP/signtool-dotnet/sign"
          cp "$RUNNER_TEMP/sigtest/target/release/sigtest.exe" "$GITHUB_WORKSPACE/sigtest2.exe"

          # Try whichever subcommand exists. Recorded as a loop rather than
          # hardcoded so this keeps working across the ongoing rename.
          ok=0
          for sub in artifact-signing trusted-signing; do
            if "$sign" code "$sub" --help >/dev/null 2>&1; then
              echo "using subcommand: $sub"
              "$sign" code "$sub" \
                --artifact-signing-endpoint "${{ vars.SIGNING_ENDPOINT }}" \
                --artifact-signing-account "${{ vars.SIGNING_ACCOUNT }}" \
                --artifact-signing-certificate-profile "${{ vars.SIGNING_PROFILE }}" \
                --timestamp-url http://timestamp.acs.microsoft.com \
                "$GITHUB_WORKSPACE/sigtest2.exe" && ok=1 && break
              echo "subcommand $sub failed with those option names; see help above"
            fi
          done
          test "$ok" = "1" || { echo "FAIL: could not sign with dotnet sign -- read the help output above and fix the option names"; exit 1; }

          signtool=$(find "/c/Program Files (x86)/Windows Kits/10/bin" \
                       -name signtool.exe -path "*x64*" | sort | tail -1)
          "$signtool" verify //pa //v "$GITHUB_WORKSPACE/sigtest2.exe" | tee "$RUNNER_TEMP/v2.txt"
          grep -q "StackFoundry LLC" "$RUNNER_TEMP/v2.txt" \
            || { echo "FAIL: unexpected identity from dotnet sign"; exit 1; }
          echo "OK: dotnet sign works with OIDC and is usable as a Tauri signCommand"
