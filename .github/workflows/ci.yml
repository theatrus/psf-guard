name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # The macOS signing steps below are skipped for pull_request, so a PR cannot
  # exercise them and the only other trigger is a push to main. That makes a
  # release the first place a bad signing certificate shows up. A dispatch
  # reaches them without publishing anything.
  workflow_dispatch:

# Supersede a PR's earlier run when it is pushed again. Pushes to main keep
# running to completion — each one is a distinct commit whose result we want,
# and main's runs are what populate the shared cargo cache.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: static/package-lock.json

    - name: "Check node runs"
      run: |
        node -v
        npm -v

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          libpng-dev \
          patchelf

    - name: Read Rust toolchain
      id: rust-toolchain
      run: echo "channel=$(grep 'channel' rust-toolchain.toml | sed 's/.*= *\"\(.*\)\"/\1/')" >> $GITHUB_OUTPUT
      shell: bash

    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.channel }}
        components: rustfmt, clippy

    # Replaces three hand-rolled actions/cache steps. rust-cache prunes the
    # workspace's own artifacts, stale objects, and incremental output before
    # saving, so an entry is a few hundred MB rather than the 1.3-2.5 GB the
    # raw `target` directory cost. That matters: the repo was sitting at
    # 10.03 GB against GitHub's 10 GB limit, and macOS entries were evicted so
    # fast that no macOS job ever started warm.
    #
    # Only main writes. PR runs read main's cache but never save, which stops
    # every branch from keeping its own copy of the same 2 GB.
    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2
      with:
        key: test
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install npm dependencies and build frontend
      run: |
        cd static
        npm ci
        npm run build

    - name: Run frontend tests
      run: |
        cd static
        npx vitest run
        npm run test:release

    - name: Check formatting
      run: cargo fmt -- --check

    # No separate `cargo build`. Clippy type-checks every target with every
    # feature, and `cargo test` builds the binaries anyway — the integration
    # tests reach for them through CARGO_BIN_EXE_psf-guard. The extra step
    # cost 485s on Windows and proved nothing the other two miss.
    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --verbose

    # Only Linux needs a release binary, because only the e2e job consumes
    # one. Release builds its own assets from release.yml, and the Windows and
    # macOS artifacts this job used to upload were downloaded by nothing. The
    # release profile still gets exercised on all three platforms by
    # `cargo tauri build` in test-tauri.
    - name: Build release binary (Linux, for the e2e job)
      if: matrix.os == 'ubuntu-22.04'
      run: cargo build --verbose --release

    - name: Upload artifact (Linux)
      if: matrix.os == 'ubuntu-22.04'
      uses: actions/upload-artifact@v7
      with:
        name: psf-guard-linux-x64
        path: target/release/psf-guard

  e2e:
    name: Playwright end-to-end (Linux)
    runs-on: ubuntu-22.04
    needs: test
    steps:
    - uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: static/package-lock.json

    - name: Install frontend deps
      run: |
        cd static
        npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('static/package-lock.json') }}

    - name: Install Playwright Chromium
      run: |
        cd static
        npx playwright install --with-deps chromium

    - name: Cache FITS fixtures
      # ~470 MB across four files; reuse between runs when the manifest
      # hasn't changed (sha256 of each file is checked at download time).
      uses: actions/cache@v6
      with:
        path: ~/.cache/psf-guard-e2e-fixtures
        key: ${{ runner.os }}-e2e-fits-${{ hashFiles('static/e2e/fixtures/manifest.json') }}

    - name: Download psf-guard binary
      uses: actions/download-artifact@v8
      with:
        name: psf-guard-linux-x64
        path: ${{ runner.temp }}/psf-guard-bin

    - name: Make binary executable
      run: chmod +x "${{ runner.temp }}/psf-guard-bin/psf-guard"

    - name: Run Playwright tests
      env:
        PSF_GUARD_E2E_BINARY: ${{ runner.temp }}/psf-guard-bin/psf-guard
        CI: 'true'
      run: |
        cd static
        npx playwright test

    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          static/playwright-report
          static/test-results
        retention-days: 14

  test-tauri:
    name: Test Tauri Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: static/package-lock.json

    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          libpng-dev \
          patchelf


    - name: Import Apple Developer Certificate (macOS)
      if: matrix.os == 'macos-latest' && github.event_name != 'pull_request'
      env:
        APPLE_CERTIFICATE: ${{ secrets.APPLE_BUILD_CERTIFICATE }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_BUILD_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_PRIVATE: ${{ secrets.APPLE_API_KEY_PRIVATE }}
      run: |
        echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
        security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security default-keychain -s build.keychain
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
        security set-keychain-settings -t 3600 -u build.keychain
        security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
        security find-identity -v -p codesigning build.keychain

        echo $APPLE_API_KEY_PRIVATE | base64 --decode > AuthKey_$APPLE_API_KEY.p8
    - name: Verify Certificate (macOS)
      if: matrix.os == 'macos-latest' && github.event_name != 'pull_request'
      run: |
        CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID")
        CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
        echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
        echo "Certificate imported."
    - name: Read Rust toolchain
      id: rust-toolchain
      run: echo "channel=$(grep 'channel' rust-toolchain.toml | sed 's/.*= *\"\(.*\)\"/\1/')" >> $GITHUB_OUTPUT
      shell: bash

    - name: Install Rust
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        toolchain: ${{ steps.rust-toolchain.outputs.channel }}
        components: rustfmt, clippy

    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2
      with:
        key: tauri
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install npm dependencies and build frontend
      run: |
        cd static
        npm ci
        npm run build

    # Downloads the prebuilt cargo-tauri binary (tauri-cli carries binstall
    # metadata) rather than compiling the CLI from source, which took 603s on
    # Windows, 356s on macOS and 331s on Linux — every run. The old
    # `cargo install` step cached ~/.cargo/bin but not ~/.cargo/.crates.toml,
    # where cargo records what it has installed, so cargo could never tell the
    # binary was already there and rebuilt it every time. `continue-on-error`
    # then hid the whole thing.
    - name: Install Tauri CLI
      uses: taiki-e/install-action@v2
      with:
        tool: tauri-cli@2

    # `cargo build --features tauri` used to run here first. It compiled the
    # same crate with the same feature as the `cargo tauri build` below, only
    # in the debug profile, so it shared no artifacts and proved nothing the
    # bundle build does not. It cost 823s on Windows, 462s on Linux and 352s
    # on macOS every run.

    - name: Build Tauri desktop app (Linux)
      if: matrix.os == 'ubuntu-22.04'
      run: cargo tauri build --verbose

    - name: Build Tauri desktop app (Windows, with bundled CLI)
      # Tauri auto-bundles every cargo bin target, so psf-guard-cli.exe (console
      # subsystem) ships next to the GUI app with no externalBin/sidecar needed.
      # tauri.bundle-windows.json adds only the NSIS PATH hook, applied via
      # --config at bundle time (a name Tauri does NOT auto-merge into every
      # tauri-feature compile).
      if: matrix.os == 'windows-latest'
      run: cargo tauri build --verbose --config tauri.bundle-windows.json

    - name: Build Tauri desktop app (macOS, unsigned PR)
      if: matrix.os == 'macos-latest' && github.event_name == 'pull_request'
      run: bash scripts/build-macos.sh tauri build --no-bundle

    - name: Build Tauri desktop app (macOS, signed and notarized)
      if: matrix.os == 'macos-latest' && github.event_name != 'pull_request'
      env:
        APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        APPLE_API_KEY_PATH: AuthKey_${{ secrets.APPLE_API_KEY }}.p8
      run: |
        bash scripts/package-macos.sh

    - name: Upload Tauri artifacts (Ubuntu)
      if: matrix.os == 'ubuntu-22.04'
      uses: actions/upload-artifact@v7
      with:
        name: psf-guard-tauri-linux-x64
        path: |
          target/release/bundle/deb/*.deb
          target/release/bundle/appimage/*.AppImage
          target/release/psf-guard

    - name: Upload Tauri artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v7
      with:
        name: psf-guard-tauri-windows-x64
        path: |
          target/release/bundle/msi/*.msi
          target/release/bundle/nsis/*.exe
          target/release/psf-guard.exe
          target/release/psf-guard-cli.exe
    - name: Upload Tauri artifacts (macOS)
      if: matrix.os == 'macos-latest' && github.event_name != 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: psf-guard-tauri-macos-arm64
        path: |
          target/release/bundle/dmg/*.dmg
          target/release/bundle/macos/*.app
          target/release/psf-guard

    - name: Remove bundle so we don't cache it
      run: rm -rf target/release/bundle
      shell: bash
