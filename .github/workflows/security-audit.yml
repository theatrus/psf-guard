name: Security audit

# Linux and Windows jobs run on ephemeral 32-core spot runners (tfinfra
# roots/github-runners, docs/github-runners-plan.md). macOS, arm64, releases,
# and every pull request from a fork stay on GitHub's runners: a fork's code
# never runs on ours. Job names are unchanged, so the required checks still
# match.

on:
  schedule:
    - cron: '0 0 * * MON'  # Weekly on Monday
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'

jobs:
  security_audit:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","linux","ghr-linux-x64"]') }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Read Rust toolchain
        id: rust-toolchain
        run: echo "channel=$(grep 'channel' rust-toolchain.toml | sed 's/.*= *\"\(.*\)\"/\1/')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      
      - name: Run security audit
        run: cargo audit
