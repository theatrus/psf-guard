name: Director planning spike

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: Director parity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            library: psf_guard_director_ffi.dll
          - os: ubuntu-22.04
            library: libpsf_guard_director_ffi.so
          - os: macos-latest
            library: libpsf_guard_director_ffi.dylib
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p psf-guard-director-core -p psf-guard-director-ffi -p psf-guard-director-runtime -p psf-guard-director-ledger -p psf-guard-director-meta --all-targets -- -D warnings
      - run: cargo test --locked -p psf-guard-director-core -p psf-guard-director-ffi -p psf-guard-director-runtime -p psf-guard-director-ledger -p psf-guard-director-meta
      - run: cargo build --locked --profile director -p psf-guard-director-ffi
      - run: dotnet run --project tools/director-interop --configuration Release -- target/director/${{ matrix.library }} crates/director-core/tests/fixtures/decisions.json crates/director-core/tests/fixtures/rig-windows.json
      - if: runner.os == 'Windows'
        run: cargo build --locked --release -p psf-guard-director-runtime
      - if: runner.os == 'Windows'
        run: dotnet format tools/director-sidecar --verify-no-changes
      - if: runner.os == 'Windows'
        run: dotnet run --project tools/director-sidecar --configuration Release -- target/release/psf-guard-director-runtime.exe crates/director-core/tests/fixtures/decisions.json crates/director-core/tests/fixtures/rig-windows.json
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item crates/director-core/SOFARS-LICENSE.txt target/release/SOFARS-LICENSE.txt
          Copy-Item crates/director-core/THIRD_PARTY_NOTICES.md target/release/THIRD_PARTY_NOTICES.md
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: director-runtime-windows-x64
          path: |
            target/release/psf-guard-director-runtime.exe
            target/release/SOFARS-LICENSE.txt
            target/release/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
