[package]
name = "psf-guard"
version = "0.13.0"
edition = "2024"
# With two bins (psf-guard = GUI/CLI smart binary, psf-guard-cli = console-only
# CLI), name the default so `cargo run` and tauri-cli pick the app binary, not
# the sidecar. Without this Tauri bundled psf-guard-cli as the app (WiX ICE30 on
# Windows; a broken GUI elsewhere).
default-run = "psf-guard"
rust-version = "1.90"
authors = ["Yann Ramin <github@theatr.us>"]
description = "PSF Guard: Astronomical image analysis and quality assessment tool for N.I.N.A. and FITS files"
license = "Apache-2.0"
repository = "https://github.com/theatrus/psf-guard"
homepage = "https://github.com/theatrus/psf-guard"
readme = "README.md"
keywords = ["astronomy", "telescope", "imaging", "analysis", "nina"]
categories = ["command-line-utilities", "science"]

[workspace]
members = ["crates/director-core", "crates/director-ffi", "crates/director-runtime", "crates/director-ledger", "crates/director-meta", "crates/director-interop"]
default-members = ["."]
resolver = "3"

[lib]
name = "psf_guard"
path = "src/lib.rs"

[dependencies]
psf-guard-director-core = { path = "crates/director-core" }
psf-guard-director-meta = { path = "crates/director-meta" }
psf-guard-director-interop = { path = "crates/director-interop" }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["backup", "bundled", "hooks"] }
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip` makes float parsing correctly rounded. A workspace crate
# turned it on in September 2026 and feature unification switched the whole
# binary over; naming it here keeps that from flipping back with a dependency
# change, since stored JSON and fresh input must parse alike.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml_edit = { version = "0.25", features = ["serde"] }
anyhow = "1.0"
argon2 = "0.6.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4", "v5"] }
regex = "1.12"
# Scan rules: exclude and include patterns for import walks.
globset = "0.4"
semver = "1"
byteorder = "1.5"
seiza = "0.47.0"
seiza-download = "0.9.0"
seiza-imgproc = { version = "0.3.2", features = ["parallel"] }
seiza-fits = "=0.6.0"
seiza-image-io = "0.11.0"
seiza-satellites = { version = "0.22.2", features = ["serde"] }
seiza-stacking = "0.54.0"
seiza-stretch = "0.3.2"
# XISF reading. Already in the tree through seiza-stacking, which decodes both
# containers into the same `seiza_fits::FitsImage`.
seiza-xisf = "0.7.0"
seiza-background = "0.3.1"
seiza-calibration = "0.11.0"
seiza-deconvolution = "0.1.2"
seiza-stars = "0.4.0"
sha2 = "0.11"
base64 = "0.23"
rayon = "1"
bumpalo = { version = "3.20", features = ["collections"] }
image = "0.25"
imageproc = "0.27"
rand = "0.10"
nalgebra = "0.35"
# Web server dependencies
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
# HTTP clients for sync, downloads, and collaboration. Share reqwest 0.13
# and its Rustls backend with Seiza and the desktop updater.
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "stream",
    "rustls",
    "gzip",
] }
tower = { version = "0.5", features = ["util"] }
# Reads a worker's upload one frame at a time.
http-body-util = "0.1"
tower-http = { version = "0.7", features = ["fs", "trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The desktop app's daily log file; see `desktop_log`.
tracing-appender = "0.2.5"
# Embed static files into binary
include_dir = "0.7"
mime_guess = "2.0"
humantime = "2.3"
tempfile = "3.27"
tauri = { version = "2.12.4", features = ["custom-protocol", "tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2.8.3", optional = true }
tauri-plugin-process = { version = "2.4.0", optional = true }
# One app window: a second launch, such as Open PSF Guard in the worker's
# tray, brings the open window forward instead of starting another server.
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = { version = "2.14.0", optional = true }
dirs = "7.0"
dunce = "1"
rpassword = "7.5.4"
async_zip = { version = "0.0.19", features = ["tokio"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
reflink-copy = "0.1.30"
rmcp = { version = "3.5.1", features = ["server", "macros", "schemars", "transport-streamable-http-server", "transport-io"] }
schemars = "1"
# Platform memory probes for the occlusion-scan worker budget in
# `concurrency` (both already in the tree transitively). Linux uses
# /proc/meminfo and needs no crate.
[target.'cfg(unix)'.dependencies]
# macOS memory probing, and signalling the process group a WBPP run starts.
libc = "0.2"
[target.'cfg(target_os = "windows")'.dependencies]
# The worker as a Windows service: a thin wrapper of the Service Control
# Manager API.
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
] }

[dev-dependencies]
filetime = "0.2"

[features]
default = []
tauri = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-updater",
]

[profile.release]
# Enable maximum optimizations for performance
opt-level = 3
# Thin LTO over 16 codegen units. Fat LTO with one unit ran the final link on
# a single core for minutes, in every release build and every CI job that
# builds release; thin LTO keeps most of its gain and links in parallel.
lto = "thin"
codegen-units = 16
# Enable panic unwinding to be optimized away in release builds
panic = 'abort'
# Allow aggressive loop optimizations and auto-vectorization
overflow-checks = false

[profile.dev]
# Keep some optimizations in debug builds for reasonable performance during development
opt-level = 1
# Disable overflow checks in dev for performance (be careful with this)
overflow-checks = false

# Native plugin hosts must receive an error instead of unwinding across the ABI
# or inheriting the application's abort-on-panic release policy.
[profile.director]
inherits = "release"
panic = "unwind"

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
toml_edit = "0.25"

# Seiza #407's windowed read, pinned by commit until the Seiza release that
# ships it; then these go and the versions above move to it.
[patch.crates-io]
seiza-fits = { git = "https://github.com/theatrus/seiza", rev = "8e725a2d8d399824b93ce6d5fec9f96da787022b" }
seiza-xisf = { git = "https://github.com/theatrus/seiza", rev = "8e725a2d8d399824b93ce6d5fec9f96da787022b" }
seiza-image-io = { git = "https://github.com/theatrus/seiza", rev = "8e725a2d8d399824b93ce6d5fec9f96da787022b" }
seiza-core = { git = "https://github.com/theatrus/seiza", rev = "8e725a2d8d399824b93ce6d5fec9f96da787022b" }
